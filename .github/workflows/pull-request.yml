name: pull-request.yml
on:
  workflow_call:
  pull_request:
    paths:
      - "src/**"
    branches: [ "**" ]

  push:
    paths:
      - "src/**"
    branches:
      - main

jobs:
  lint:
    name: Code style / Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm turbo lint
      - name: Check formatting (Prettier)
        run: pnpm exec prettier --check "apps/**/*.{ts,tsx,js,jsx}" "packages/**/*.{ts,tsx}"

